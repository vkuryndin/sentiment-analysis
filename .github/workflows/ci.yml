name: Sentiment Analysis - Build, Test & Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name and version
        id: image
        shell: bash
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?Java 17 is required on the runner}"
          export PATH="$JAVA_HOME/bin:$PATH"
          version=$(sh ./gradlew --no-daemon --quiet --console=plain printVersion)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Cannot read application version from build.gradle.kts' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Docker image and run Gradle tests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker build --platform linux/amd64 --progress=plain \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE" .

      - name: Test final Linux container (HTTP API and metrics)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker network create --internal sentiment-ci-net
          docker run --detach --name sentiment-ci --network sentiment-ci-net "$IMAGE"
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sentiment-ci)
          [[ -n "$ip" ]]
          base="http://$ip:8085"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' --fail --silent --max-time 3 "$base/actuator/health" | jq -e '.status == "UP"' >/dev/null; then
              ready=1
              break
            fi
            if [[ $(docker inspect -f '{{.State.Running}}' sentiment-ci) != true ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Container did not become healthy.' >&2
            exit 1
          fi
          bash scripts/test-container.sh "$base"

      - name: Verify image size (strictly below 150 MB)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "Image size: $size bytes"
          echo "Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $size bytes (limit: < 150000000 bytes)" >> "$GITHUB_STEP_SUMMARY"
          docker image ls "$IMAGE"
          if (( size >= 150000000 )); then
            echo 'Image exceeds or equals the 150 MB limit.' >&2
            exit 1
          fi

      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect sentiment-ci >/dev/null 2>&1; then
            docker logs sentiment-ci || true
            docker rm -f sentiment-ci
          fi
          if docker network inspect sentiment-ci-net >/dev/null 2>&1; then
            docker network rm sentiment-ci-net
          fi

      - name: Publish verified image to GHCR
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io
          echo "Published: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
