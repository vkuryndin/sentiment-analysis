apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentiment-analysis
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sentiment-analysis
                port:
                  number: 80
